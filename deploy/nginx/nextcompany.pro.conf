limit_req_zone $binary_remote_addr zone=nextcompany_public:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name nextcompany.pro www.nextcompany.pro;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://nextcompany.pro$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nextcompany.pro;
    ssl_certificate /etc/letsencrypt/live/nextcompany.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextcompany.pro/privkey.pem;
    return 301 https://nextcompany.pro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nextcompany.pro;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/nextcompany.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextcompany.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location / {
        limit_req zone=nextcompany_public burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
