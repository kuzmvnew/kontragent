# Staging is loopback-only. Remote operators must use the authenticated private
# access path (VPN/SSH tunnel); no public DNS or wildcard bind is permitted.
server {
    listen 127.0.0.1:18080;
    server_name staging.invalid;

    auth_basic "NEXT Company staging";
    auth_basic_user_file /etc/nextcompany-staging/htpasswd;

    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
