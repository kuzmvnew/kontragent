name: W1-002 real PostgreSQL and Chromium acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U test -d test" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      DADATA_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - name: Full offline regression and whitespace check
        run: |
          git diff --check
          uv run python -m pytest tests -q
      - run: uv run alembic upgrade head
      - name: Real source, disposable PostgreSQL and actual company pages
        run: |
          uv run --with playwright==1.63.0 python -m playwright install chromium
          uv run python - <<'PY'
          from app.database.base import Base
          from app.database.postgres import engine, get_session
          import app.models
          from app.models.company import Company
          assert engine.url.database == 'test' and engine.url.host == 'localhost'
          Base.metadata.create_all(engine)
          with get_session() as session:
              session.add_all([Company(inn='9706063520', name='БАНК ЭЛЕМЕНТ (ООО)', entity_type='legal'), Company(inn='9102309919', name='АО КРЫМАВТОДОР', entity_type='legal')])
              session.commit()
          PY
          uv run --with playwright==1.63.0 python -u -m scripts.accept_cbr_finorg --tests --live --browser --environment ci-disposable --output-dir data/acceptance/w1-002-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-002-acceptance-evidence
          path: data/acceptance/w1-002-ci/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wave1-handoff-documents
          path: |
            WAVE1_STATUS.md
            PROJECT_STATUS.md
            ROADMAP.md
            ROADMAP_DETAILED.md
            ROADMAP_CHANGES_AFTER_AUDIT.md
            PHASE_4_START_PACKAGE.md
            docs/W1_001_ACCEPTANCE.md
            docs/W1_002_ACCEPTANCE.md
            docs/W1_003_ACCEPTANCE.md
            docs/CODEX_WAVE1_HANDOFF_PROMPT.md
            docs/WAVE1_HANDOFF_2026-09-16.md
          retention-days: 7
