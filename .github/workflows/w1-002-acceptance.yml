name: W1-002 real PostgreSQL and Chromium acceptance
on:
  push:
    branches: [acceptance/w1-002-browser]
    paths: [.github/workflows/w1-002-acceptance.yml]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U test -d test" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      DADATA_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - name: Full offline baseline before source/browser acceptance
        run: uv run python -m pytest tests -q
      - name: Export tracked baseline for review
        run: git archive --format=zip HEAD -o /tmp/w1-002-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: w1-002-source-review
          path: /tmp/w1-002-source.zip
          retention-days: 1
      - run: uv run alembic upgrade head
      - name: Real source, disposable PostgreSQL and actual company pages
        if: ${{ hashFiles('scripts/accept_cbr_finorg.py') != '' }}
        run: |
          uv run --with playwright==1.63.0 python -m playwright install chromium
          uv run python - <<'PY'
          from app.database.base import Base
          from app.database.postgres import engine, get_session
          import app.models
          from app.models.company import Company
          assert engine.url.database == 'test' and engine.url.host == 'localhost'
          Base.metadata.create_all(engine)
          with get_session() as session:
              session.add_all([Company(inn='7707083893', name='ПАО Сбербанк', entity_type='legal'), Company(inn='9102309919', name='АО КРЫМАВТОДОР', entity_type='legal')])
              session.commit()
          PY
          uv run --with playwright==1.63.0 python -u -m scripts.accept_cbr_finorg --tests --live --browser --environment ci-disposable --output-dir data/acceptance/w1-002-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-002-acceptance-evidence
          path: data/acceptance/w1-002-ci/
          retention-days: 7
