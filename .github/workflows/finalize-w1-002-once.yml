name: Finalize verified W1-002 Mac acceptance once
on:
  push:
    branches: [docs/finalize-w1-002-mac]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Record verified Mac acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old in s:
                  p.write_text(s.replace(old,new))

          # Acceptance control must use a real exact-INN company that exists in the user's Master Registry.
          replace('scripts/accept_cbr_finorg.py', "FOUND_INN = '7707083893'", "FOUND_INN = '9706063520'")

          # Canonical Wave status: replace whole compact file to avoid stale mixed claims.
          Path('WAVE1_STATUS.md').write_text('''# Wave 1 — официальный промежуточный статус\n\nДата: 16.09.2026. Фаза 3 завершена в согласованном объёме; Фаза 4 ACTIVE.\nЭто статус результатов, не изменение утверждённой архитектуры и порядка разработки.\n\n| Шаг | Источник | Фактическое состояние |\n|---|---|---|\n| W1-001 | CBR Warning List | ACCEPTED / SIX GATES PASS на Mac |\n| W1-002 | CBR FinOrg | ACCEPTED / SIX GATES PASS на Mac |\n| W1-003 | ФНС — МСП, получатели поддержки | ACCEPTED / SIX GATES PASS на Mac |\n| W1-004 | Росздравнадзор | NEXT / NOT STARTED |\n| W1-005 | Роскомнадзор | NOT STARTED |\n| W1-006 | НОСТРОЙ / СРО | NOT STARTED |\n\nПолностью приняты на пользовательском Mac 3 источника из 6. Следующая задача — только W1-004 Росздравнадзор.\n\n## W1-001\nПротокол: [docs/W1_001_ACCEPTANCE.md](docs/W1_001_ACCEPTANCE.md). Импорт не повторять.\n\n## W1-002\nПротокол: [docs/W1_002_ACCEPTANCE.md](docs/W1_002_ACCEPTANCE.md).\nЛокальный Mac acceptance 16.09.2026: `W1-002 SIX GATES: PASS`; gates 1—6 PASS; `accepted=true`; `user_mac_accepted=true`; PostgreSQL `kontragent`; Alembic `f7b2d8a4c1e3`; 435 tests PASS.\nРеальный found: ИНН `9706063520`, БАНК ЭЛЕМЕНТ (ООО), CBR ID `2000000352020`, 2 лицензии/права, 2 active; HTTP 200; PostgreSQL reread `cached=true`; Chromium HTTP 200, `page_errors=[]`.\nРеальный not_found: ИНН `9102309919`, АО «КРЫМАВТОДОР»; HTTP 200; PostgreSQL reread `cached=true`; Chromium HTTP 200, `page_errors=[]`.\nПокрытие on-demand cache на дату проверки: Master Registry `6 781 485`; 3 успешных cache-INN, 2 из них относятся к Master Registry; 2 checked Master / 6 781 483 unchecked. Это НЕ bulk-реестр ЦБ. Дата — дата точечной проверки, не дата полного реестра. `auto_update=NOT_CONFIGURED`.\n\n## W1-003\nФинальная приёмка: [docs/W1_003_ACCEPTANCE.md](docs/W1_003_ACCEPTANCE.md). На Mac `SIX GATES PASS`; импорт не повторять.\n\n## W1-004—W1-006\nW1-004 Росздравнадзор — следующий и пока NOT STARTED. Перед реализацией установить точный официальный подреестр, машинный канал, формат, даты/обновление, exact identifiers, режим нагрузки/хранения и source passport. W1-005 и W1-006 не начинать вместе с ним.\n\n## Общие ограничения\nКаждый источник проходит отдельно: tests; реальный официальный ответ; PostgreSQL write/read; found/not_found/not_applicable/unavailable; настоящий Chromium; количества/даты/покрытие. Только exact identifiers. Код готов, данные загружены, PostgreSQL подтверждён, браузер проверен, покрытие измерено и auto-update настроен — разные статусы.\nPerson / Leads / CRM / Enterprise не начинать. РНП/ЕИС отложен до официального доступа; DaMIA не подключать.\n''')

          # Append immutable local evidence to W1-002 protocol and remove pending headline.
          p=Path('docs/W1_002_ACCEPTANCE.md'); s=p.read_text()
          s=s.replace('Статус: REAL CI SIX GATES PASS; пользовательская LOCAL ACCEPTANCE PENDING.', 'Статус: **ACCEPTED / SIX GATES PASS на пользовательском Mac**.')
          s=s.replace('реальные страницы /company/7707083893 и /company/9102309919', 'реальные страницы /company/9706063520 и /company/9102309919')
          if '## Финальная локальная приёмка на Mac — 16.09.2026' not in s:
              s += '''\n## Финальная локальная приёмка на Mac — 16.09.2026\n\nИтог: `W1-002 SIX GATES: PASS`; gates 1—6 PASS; `accepted=true`; `user_mac_accepted=true`; `platform=Darwin`; `database=kontragent`; Alembic `f7b2d8a4c1e3`; Git baseline `27a15affbba7671a866b84fcff5ec3b933831d6b`; 435 tests PASS.\n\nКонтрольный found изменён с Сбербанка, отсутствующего в пользовательском Master Registry, на реально существующий exact-INN: `9706063520` — БАНК ЭЛЕМЕНТ (ООО), Master ID 1227. Официальный CBR FinOrg: `found`, CBR ID `2000000352020`, 2 лицензии/права, 2 active. PostgreSQL reread `cached=true`; Chromium HTTP 200, visible found, `page_errors=[]`.\n\nКонтрольный not_found: `9102309919` — АО «КРЫМАВТОДОР», присутствует в Master Registry; официальный ответ HTTP 200 `not_found`, 0 лицензий; PostgreSQL reread `cached=true`; Chromium HTTP 200, visible not_found, `page_errors=[]`.\n\nOn-demand coverage: 3 успешных cache-INN на 16.09.2026; 2 текущих checked Master companies из 6 781 485; 6 781 483 unchecked; full CBR registry size/bulk import — N/A. Это измерение датированного on-demand cache, не утверждение полноты реестра ЦБ. Три официальных SOAP-вызова HTTP 200. `auto_update=NOT_CONFIGURED`.\n\nЛокальные screenshot/report остаются в `data/acceptance/w1-002/20260916T175944809035Z/` на пользовательском Mac и не коммитятся как dataset.\n'''
          p.write_text(s)

          # Synchronize status phrases in project documents without changing roadmap order.
          replacements = [
            ('W1-001/W1-003 ACCEPTED на Mac; W1-002 локальная приёмка ожидается; W1-004—W1-006 впереди', 'W1-001/W1-002/W1-003 ACCEPTED / SIX GATES PASS на Mac; W1-004—W1-006 впереди'),
            ('W1-002 LOCAL ACCEPTANCE PENDING', 'W1-002 ACCEPTED / SIX GATES PASS on Mac'),
            ('W1-002 локальная приёмка ожидается', 'W1-002 ACCEPTED / SIX GATES PASS на Mac'),
            ('W1-002 имеет подтверждённый LIVE + CACHE', 'W1-002 ACCEPTED / SIX GATES PASS на Mac'),
            ('Отдельная browser acceptance W1-002 не подтверждена и не должна выводиться из W1-001.', 'Отдельная browser acceptance W1-002 подтверждена на Mac 16.09.2026: found 9706063520 и not_found 9102309919, Chromium HTTP 200, page_errors=[].'),
            ('Status: **LIVE + CACHE PASS**, not a bulk registry import.', 'Status: **ACCEPTED / SIX GATES PASS on user Mac**, on-demand integration, not a bulk registry import.'),
          ]
          for path in ['PROJECT_STATUS.md','ROADMAP.md','ROADMAP_DETAILED.md','ROADMAP_CHANGES_AFTER_AUDIT.md','PHASE_4_START_PACKAGE.md','docs/WAVE1_HANDOFF_2026-09-16.md']:
              p=Path(path)
              if not p.exists(): continue
              s=p.read_text()
              for old,new in replacements: s=s.replace(old,new)
              marker='\n\n### W1-002 final Mac acceptance — 16.09.2026\n'
              if marker.strip() not in s:
                  s += marker + 'W1-002 is ACCEPTED / SIX GATES PASS on the user Mac. Real found exact-INN: 9706063520 (БАНК ЭЛЕМЕНТ (ООО), 2 licences/rights); real not_found: 9102309919. PostgreSQL kontragent reread PASS; Chromium found/not_found HTTP 200, page_errors=[]; 435 tests PASS. On-demand coverage is dated cache coverage, not a bulk CBR registry. auto_update=NOT_CONFIGURED. Source protocol: docs/W1_002_ACCEPTANCE.md.\n'
              p.write_text(s)

          # Codex handoff: make W1-004 the only next development task.
          p=Path('docs/CODEX_WAVE1_HANDOFF_PROMPT.md'); s=p.read_text()
          start=s.find('W1-002 — локально ранее LIVE+CACHE PASS;')
          if start >= 0:
              end=s.find('\nПолная Wave 1:', start)
              s=s[:start] + 'W1-002 — ACCEPTED / SIX GATES PASS на Mac 16.09.2026; found 9706063520, not_found 9102309919; PostgreSQL/Chromium/coverage PASS; 435 tests. Повторную приёмку без причины не запускать.\n' + s[end:]
          # Remove obsolete conditional paragraph if present.
          old='Если W1-002 ещё не принят локально, текущая задача только завершить его приёмку: uv run --with playwright==1.63.0 python -m playwright install chromium; uv run --with playwright==1.63.0 python -u -m scripts.accept_cbr_finorg --tests --live --browser. Проверь report.json, обе PNG, реальную PostgreSQL и измеренное покрытие. Не подменяй эти данные CI. Обнови статусные документы после подтверждения, покажи отчёт и жди подтверждения фиксации/перехода.\n'
          s=s.replace(old, 'W1-001—W1-003 приняты на Mac. Не повторяй их массовые импорты/acceptance без доказанной необходимости. Следующая разработка — только W1-004 Росздравнадзор.\n')
          p.write_text(s)
          PY

          git diff --check
          git status --short
          git config user.name 'kontragent-docs'
          git config user.email 'kontragent-docs@users.noreply.github.com'
          git add scripts/accept_cbr_finorg.py WAVE1_STATUS.md docs/W1_002_ACCEPTANCE.md docs/CODEX_WAVE1_HANDOFF_PROMPT.md PROJECT_STATUS.md ROADMAP.md ROADMAP_DETAILED.md ROADMAP_CHANGES_AFTER_AUDIT.md PHASE_4_START_PACKAGE.md docs/WAVE1_HANDOFF_2026-09-16.md
          git rm .github/workflows/finalize-w1-002-once.yml
          git commit -m 'Docs: accept W1-002 on Mac and hand off W1-004'
          git push origin HEAD:docs/finalize-w1-002-mac
