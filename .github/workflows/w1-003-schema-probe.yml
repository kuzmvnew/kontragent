name: W1-003 official XML shape probe
on:
  push:
    branches: [fix/w1-003-live-xml]
    paths: [.github/workflows/w1-003-schema-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Independent count audit of bounded official archive prefix
        shell: python
        run: |
          import urllib.request, struct, zlib, json, xml.etree.ElementTree as ET
          url='https://file.nalog.ru/opendata/7707329152-rsmppp/data-20260815-structure-20230615.zip'
          req=urllib.request.Request(url, headers={'Range':'bytes=0-8388607'})
          with urllib.request.urlopen(req, timeout=45) as r:
              print('HTTP',r.status,'RANGE',r.headers.get('Content-Range'),flush=True)
              data=r.read(8388608)
          offset=0; reports=[]
          while data[offset:offset+4]==b'PK\x03\x04' and len(reports)<3:
              fields=struct.unpack_from('<4s5H3I2H',data,offset)
              method,crc,compressed,nlen,xlen=fields[3],fields[6],fields[7],fields[9],fields[10]
              name=data[offset+30:offset+30+nlen].decode('utf8',errors='replace')
              start=offset+30+nlen+xlen
              if name.lower().endswith('.xml'):
                  assert compressed and start+compressed<=len(data)
                  dec=zlib.decompressobj(-15)
                  raw=dec.decompress(data[start:start+compressed],64000000) if method==8 else data[start:start+compressed]
                  assert method in(0,8) and (method==0 or dec.eof)
                  assert zlib.crc32(raw)&0xffffffff==crc
                  root=ET.fromstring(raw)
                  docs=[e for e in root if e.tag.rsplit('}',1)[-1]=='Документ']
                  facts=sum(sum(e.tag.rsplit('}',1)[-1]=='СвПредПод' for e in d) for d in docs)
                  reports.append({'member':name,'root':root.tag,'header':root.attrib,'direct_documents':len(docs),'support_facts':facts,'crc_valid':True,'xml_eof_valid':True})
              offset=start+compressed
          print(json.dumps(reports,ensure_ascii=False,indent=2),flush=True)
          assert len(reports)==3
