name: W1-003 full archive parser and real violation regression
on:
  workflow_dispatch:
  push:
    branches: [fix/w1-003-violation-details]
    paths: [.github/workflows/w1-003-full-parser.yml]
permissions:
  contents: read
jobs:
  full-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U test -d test" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      DADATA_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - run: uv run python -m pytest tests -q
      - run: uv run alembic upgrade head
      # Ubuntu's hosted runner already contains Chromium's shared libraries.
      # Browser launch remains mandatory and fails on missing runtime libraries.
      - run: uv run --with playwright==1.63.0 python -m playwright install chromium
      - name: Full archive parser and exact Mac failure PostgreSQL/Chromium proof
        run: uv run --with playwright==1.63.0 python -u -c "import runpy; runpy.run_path('tests/acceptance/run_w1_003_full_parser.py', run_name='__main__')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-003-full-parser-evidence
          path: |
            data/acceptance/w1-003-full-parser/report.json
            data/acceptance/w1-003-full-parser/*.png
          retention-days: 7
