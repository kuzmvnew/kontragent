          Локальный отчёт: /Users/mikhailkuznetsov/Documents/kontragent/data/acceptance/w1-003/20260916T154816Z/report.json.
          environment=user-local, accepted=true, все gates 1—6 PASS; PostgreSQL kontragent, Alembic f7b2d8a4c1e3, run_id=14.

