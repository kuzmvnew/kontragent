          Snapshot ДатаСост: 15.09.2026. Даты решений 29.10.2018—31.08.2026; даты сведений 20.12.2020—15.09.2026. metadata_data_date=15.10.2026 хранится отдельно и не подменяет дату snapshot.
          Официальный ZIP data-20260915-structure-20230615.zip, 833094667 байт, SHA-256 7b651669eac2098256ac9dfd850a1cbedca830a2850e28277212ef06955b89ce.
          Полнота обработки всех членов ZIP подтверждена CRC/EOF, независимыми подсчётами, неизменностью SHA-256 и сверкой PostgreSQL. Это не заявление о внутренней базе ФНС. Несовпадение заголовка КолДок во всех 14 214 файлах сохранено как MISMATCH, не как PASS.
          Реальные browser-карточки: 0100000011 ООО «ПСЫГУПС» — found, один факт консультационной поддержки; 9102309919 АО «КРЫМАВТОДОР» — not_found. Обе HTTP 200, ограничения видны, page_errors=[]. reread_pass=true и ledger_matches_snapshot=true.
          not_found означает отсутствие exact-INN факта только в полном успешно опубликованном snapshot на указанную дату. Непроверенность/ошибка — unavailable. N/A для отдельной бизнес-неприменимости при корректном ЮЛ/ИП. Наличие поддержки не равно оценке надёжности.
          Все шесть критериев PASS; auto_update=NOT_CONFIGURED — отдельный статус. Повторный импорт только ради подтверждения старого результата НЕ нужен.
