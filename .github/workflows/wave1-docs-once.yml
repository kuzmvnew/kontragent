name: Synchronize verified Wave 1 documents once
on:
  push:
    branches: [acceptance/w1-002-browser]
    paths: [.github/workflows/wave1-docs-once.yml]
permissions:
  contents: write
jobs:
  docs:
    if: github.repository == 'kuzmvnew/kontragent' && github.ref == 'refs/heads/acceptance/w1-002-browser'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acceptance/w1-002-browser
      - name: Synchronize status only; preserve approved architecture and phase order
        shell: python
        run: |
          from pathlib import Path
          w2 = 'W1-002 CBR FinOrg: LIVE + CACHE PASS на Mac; отдельная реальная PostgreSQL/Chromium приёмка на CI PASS (run 35129041426, 435 tests). Полные SIX GATES на пользовательском Mac пока NOT CONFIRMED. Команда и доказательства: docs/W1_002_ACCEPTANCE.md.'
          w3 = 'W1-003 ФНС — МСП, получатели поддержки: ACCEPTED / SIX GATES PASS на пользовательском Mac 16.09.2026, code de32573 (PR #29). Snapshot 15.09.2026; PostgreSQL 11 925 998 фактов ЮЛ/ИП; Master Registry 6 781 485, exact-INN связаны 1 897 870 сущностей. Подробности: docs/W1_003_ACCEPTANCE.md.'
          summary = 'Wave 1 содержит шесть источников. W1-001 и W1-003 приняты на Mac. W1-002: LIVE + CACHE PASS на Mac, полный реальный CI PASS; локальная browser/six-gate приёмка ожидается. W1-004 Росздравнадзор, W1-005 Роскомнадзор, W1-006 НОСТРОЙ / СРО — NOT STARTED. Точка входа: WAVE1_STATUS.md. Порядок фаз и архитектура не меняются.'
          files = ['PROJECT_STATUS.md','ROADMAP.md','ROADMAP_DETAILED.md','ROADMAP_CHANGES_AFTER_AUDIT.md','PHASE_4_START_PACKAGE.md']
          for name in files:
              p = Path(name); old = p.read_text(); lines = old.splitlines(); result=[]; changed=0
              for line in lines:
                  replacement = line
                  if name == 'PROJECT_STATUS.md':
                      if line.startswith('| 4. Качество данных |'):
                          replacement = '| 4. Качество данных | ▶️ ACTIVE | Wave 1: W1-001/W1-003 ACCEPTED на Mac; W1-002 локальная приёмка ожидается; W1-004—W1-006 впереди |'
                      elif line.startswith('- **W1-002 CBR FinOrg:'):
                          replacement = '- ' + w2
                      elif line.startswith('- **W1-003 ФНС'):
                          replacement = '- ' + w3 + '\n- W1-004 Росздравнадзор / W1-005 Роскомнадзор / W1-006 НОСТРОЙ, СРО: NOT STARTED; не запускать без отдельной команды. Полная таблица: [WAVE1_STATUS.md](WAVE1_STATUS.md).'
                  elif name == 'ROADMAP.md':
                      if line.startswith('Текущий согласованный блок — Wave 1'):
                          replacement = summary
                      elif line.startswith('Фаза 4 ▶️ ACTIVE — Wave 1'):
                          replacement = 'Фаза 4 ▶️ ACTIVE — ' + summary
                      elif line.startswith('Person backlog сохранён, но не исполняется сейчас. W1-001'):
                          replacement = 'Person backlog сохранён, но не исполняется сейчас. ' + summary
                  elif name == 'ROADMAP_DETAILED.md':
                      if line.startswith('**Сейчас по этому подробному разрезу:**'):
                          replacement = line.split('Текущий блок —')[0] + summary + ' Номера источников не являются процентом готовности продукта.'
                      elif line.startswith('- [x] **W1-002 CBR FinOrg**'):
                          replacement = '- [ ] **' + w2 + '**'
                      elif line.startswith('- [ ] **W1-003 ФНС'):
                          replacement = '- [x] **' + w3 + '**\n- [ ] **W1-004 Росздравнадзор** — NOT STARTED. Точный реестр и паспорт источника подтвердить перед реализацией.\n- [ ] **W1-005 Роскомнадзор** — NOT STARTED; только после отдельной команды.\n- [ ] **W1-006 НОСТРОЙ / СРО** — NOT STARTED; только после отдельной команды.'
                      elif line.startswith('**Ближайший шаг после отдельной команды:** W1-003'):
                          replacement = '**Ближайший шаг:** локальная приёмка W1-002 по docs/W1_002_ACCEPTANCE.md; затем фиксация отчёта. Следующий новый источник — только W1-004 после отдельной команды. W1-001/W1-003 повторно не импортировать.'
                  elif name == 'ROADMAP_CHANGES_AFTER_AUDIT.md':
                      if line.startswith('W1-002 CBR FinOrg remains'):
                          replacement = w2
                      elif line.startswith('W1-003 — FNS SME support recipients —'):
                          replacement = w3 + '\n\n' + summary
                  elif name == 'PHASE_4_START_PACKAGE.md':
                      if line.startswith('Approved clarification (2026-09-16):'):
                          replacement = 'Approved clarification (2026-09-16): all six agreed Wave 1 sources must be accepted before SEO MVP; they are not all complete yet. ' + summary
                      elif line.startswith('- W1-002 CBR FinOrg:'):
                          replacement = '- ' + w2
                      elif line.startswith('- W1-003 FNS SME support recipients:'):
                          replacement = '- ' + w3 + '\n- W1-004 Росздравнадзор / W1-005 Роскомнадзор / W1-006 НОСТРОЙ, СРО: NOT STARTED.'
                  changed += replacement != line
                  result.append(replacement)
              assert changed >= 2, (name, 'Unexpected baseline; refusing broad replacement')
              p.write_text('\n'.join(result)+'\n')
          p=Path('docs/WAVE1_HANDOFF_2026-09-16.md'); old=p.read_text()
          old=old.replace('This document records status only; it does not start W1-003 and does not change architecture or roadmap order.', 'Updated after W1-003 local PASS and W1-002 CI browser acceptance. Status only; no change to architecture or roadmap order.')
          start=old.index('## W1-002 — CBR FinOrg'); end=old.index('## Boundaries')
          p.write_text(old[:start] + '## W1-002 — CBR FinOrg\n\n'+w2+'\n\n## W1-003 — FNS SME support recipients\n\n'+w3+'\n\n## W1-004—W1-006\n\n'+summary+'\n\nАктуальная миграция после W1-003: `f7b2d8a4c1e3`. Старое значение выше относится только к исторической приёмке W1-001. Промпт передачи: `docs/CODEX_WAVE1_HANDOFF_PROMPT.md`. Не считать CI-проверку приёмкой на пользовательском Mac.\n\n'+old[end:])
          for name in ('docs/W1_003_REPAIR_STATUS.md','docs/W1_003_VIOLATION_DETAILS.md'):
              p=Path(name); lines=p.read_text().splitlines()
              lines.insert(1, '\n> Исторический отчёт этапа исправления. Финальная локальная приёмка W1-003 теперь ACCEPTED: см. [W1_003_ACCEPTANCE.md](W1_003_ACCEPTANCE.md). Старые NOT ACCEPTED ниже относятся к прошлым попыткам.\n')
              p.write_text('\n'.join(lines)+'\n')
          Path('WAVE1_STATUS.md').write_text('''# Wave 1 — официальный промежуточный статус

          Дата: 16.09.2026. Фаза 3 завершена в согласованном объёме; Фаза 4 ACTIVE.
          Это статус результатов, не изменение утверждённой архитектуры и порядка разработки.

          | Шаг | Источник | Фактическое состояние |
          |---|---|---|
          | W1-001 | CBR Warning List | ACCEPTED / SIX GATES PASS на Mac |
          | W1-002 | CBR FinOrg | LIVE + CACHE PASS на Mac; реальные шесть критериев PASS на отдельном CI; LOCAL ACCEPTANCE PENDING |
          | W1-003 | ФНС — МСП, получатели поддержки | ACCEPTED / SIX GATES PASS на Mac |
          | W1-004 | Росздравнадзор | NOT STARTED |
          | W1-005 | Роскомнадзор | NOT STARTED |
          | W1-006 | НОСТРОЙ / СРО | NOT STARTED |

          Полностью приняты на пользовательском Mac 2 источника из 6. Проценты 95/98/100 без измеренной методики не используются. После локального PASS W1-002 будет 3 из 6, а НЕ завершение всей волны.

          ## W1-001
          Протокол: [docs/W1_001_ACCEPTANCE.md](docs/W1_001_ACCEPTANCE.md).
          27 163 записей ЦБ, 2 995 usable INN, 857 exact-INN связей с Master Registry 6 781 485. Реальные found/not_found проверены Chromium. 16.09.2026 — retrieval date, не официальная дата состояния всего списка. Импорт не повторять.

          ## W1-002
          Протокол и команда: [docs/W1_002_ACCEPTANCE.md](docs/W1_002_ACCEPTANCE.md).
          Реальный CI run 35129041426: 435 tests PASS; Сбербанк 7707083893 found (10 лицензий/прав, 9 активных по логике сервиса), Крымавтодор 9102309919 not_found; PostgreSQL reread/cache и обе карточки Chromium HTTP 200, page_errors=[].
          Это отдельная PostgreSQL test с двумя контрольными компаниями, НЕ пользовательский Master Registry. Полный локальный отчёт шести критериев W1-002 ещё не получен. Режим ON_DEMAND_WITH_DATED_CACHE: счётчик кэша и его пересечение с Master измеряются; полного массового реестра ЦБ эта интеграция не загружает.

          ## W1-003
          Финальная приёмка: [docs/W1_003_ACCEPTANCE.md](docs/W1_003_ACCEPTANCE.md).
          На Mac сохранены 11 925 998 фактов ЮЛ/ИП из 12 658 265 фактов, 14 214 XML, 3 361 365 документов; 732 267 NPD-only исключены. Snapshot 15.09.2026. Связаны 8 794 960 фактов с 1 897 870 Master-сущностями из 6 781 485. Приёмка всех шести критериев PASS, обе реальные карточки Chromium проверены. Импорт не повторять.

          ## W1-004—W1-006
          Названия и нумерация восстановлены по прямому уточнению Михаила в рабочем чате 16.09.2026; ранее подробный список Wave 1 в Git ошибочно показывал только 001—003. Это восстановление согласованного состава, не добавление новых источников.
          Точные подреестры, машинный канал, формат, даты, режим нагрузки, модель идентификаторов и критерии конкретного источника фиксируются в его паспорте до реализации. Не подменять Роскомнадзор задачей уведомления о персональных данных самого сервиса. Не расширять НОСТРОЙ / СРО автоматически на все строительные реестры.
          Следующий новый источник — только W1-004 после отдельной команды. W1-005 и W1-006 не начинать вместе с ним.

          ## Общие ограничения
          Каждый источник: tests; реальный официальный ответ; PostgreSQL write/read; found/not_found/not_applicable/unavailable; настоящий браузер; количества/даты/покрытие. Для каждого отдельно PASS / NOT CONFIRMED / N/A с объяснением.
          Отсутствие данных не означает безопасность или наличие лицензии. Только exact identifiers, без fuzzy-доказательств.
          Автообновление W1-001/W1-002/W1-003: NOT_CONFIGURED. On-demand refresh не является расписанием.
          Person / Leads / CRM / Enterprise не начинать. РНП/ЕИС отложен до официального доступа; DaMIA не подключать.
          Код готов, CI прошёл, локальная PostgreSQL принята, браузер проверен, покрытие измерено, автообновление настроено — отдельные статусы.
          ''')
          Path('docs/W1_002_ACCEPTANCE.md').write_text('''# W1-002 — CBR FinOrg: протокол приёмки

          Статус: REAL CI SIX GATES PASS; пользовательская LOCAL ACCEPTANCE PENDING.
          Кодовый baseline перед задачей: de325730757884a924bb11db3e30fa4d2342191d (PR #29). Доработка приёмки: PR #30.

          ## Что реализовано
          scripts/accept_cbr_finorg.py использует существующие provider/service, не создаёт альтернативный источник. Реальный FastAPI запускается на свободном localhost-порту, реальные страницы /company/7707083893 и /company/9102309919 открываются Chromium. Проверяются HTTP 200, видимый result, лицензии и их количество, число active по текущей логике, ограничения интерпретации и отсутствие page_errors. Сохраняются PNG и report.json.
          --live выполняет только две точечные проверки (максимум три SOAP-запроса с интервалом 2 секунды), сохраняет ответы в существующую PostgreSQL и SOAP-файлы с SHA-256 в локальный каталог приёмки. Без --live источник не запрашивается, используются успешные записи текущего дня.
          Скрипт не вставляет фиктивные компании в пользовательский Master Registry, не применяет миграции, не перезапускает импорты W1-001/W1-003 и не меняет Git. В пользовательском режиме требуется БД kontragent и существование обеих реальных компаний. В CI используется отдельная БД test, контекст явно обозначен.

          ## Фактический CI-прогон
          GitHub Actions: https://github.com/kuzmvnew/kontragent/actions/runs/35129041426
          Head PR: d6d7ce961b09f189a76e30be987b215f330ed128. Проверенный merge-ref: 3ac4cf67650a9306d725e6b189538d145e48992a.
          16.09.2026 17:35 UTC; 435 passed; все шесть критериев PASS в отдельном Linux/PostgreSQL/Chromium окружении. До разработки acceptance полный baseline 421 тест (workflow 35128592401).

          | Реальный ИНН | Официальный ответ | PostgreSQL reread | Chromium |
          |---|---|---|---|
          | 7707083893 — ПАО Сбербанк | found; 10 лицензий/прав, 9 active по текущей логике | PASS, cached=True | HTTP 200, visible found, page_errors=[] |
          | 9102309919 — АО Крымавтодор | not_found, 0 лицензий | PASS, cached=True | HTTP 200, visible not_found, ограничение показано, page_errors=[] |

          Три официальных HTTP 200. Источник: https://www.cbr.ru/FO_ZoomWS/FinOrg.asmx ; методы SearchByINNs и GetFullInfoByINN. Артефакт 10460568286 w1-002-acceptance-evidence содержит report.json, tests.log, server.log, SOAP-ответы и оба PNG. Срок хранения артефакта 7 дней; текстовый протокол остаётся в Git.
          Кэш CI: 2 успешные строки, 0 ошибок, 2 контрольные Master-компании. Эти числа НЕ переносятся в пользовательский Master Registry 6 781 485.

          ## Локальный запуск на Mac
          ```bash
          cd /Users/mikhailkuznetsov/Documents/kontragent &&
          git pull --ff-only &&
          git log -1 --oneline &&
          uv run --with playwright==1.63.0 python -m playwright install chromium &&
          uv run --with playwright==1.63.0 python -u -m scripts.accept_cbr_finorg --tests --live --browser
          ```
          Скрипт создаёт data/acceptance/w1-002/<UTC timestamp>/report.json, found.png и not_found.png. Он не публикует эти локальные файлы автоматически в Git.
          Успех: gates 1—6 PASS, accepted=true, user_mac_accepted=true, database=kontragent, platform=Darwin и W1-002 SIX GATES: PASS. При ошибке будет NOT ACCEPTED; непроверенное не помечается успешным.
          После получения отчёта сохранить обезличенный протокол с SHA кода, датой, реальными количествами кэша/покрытия и browser evidence, затем синхронизировать WAVE1_STATUS/PROJECT_STATUS/roadmap/handoff. Пока локальный запуск не выполнен — не писать ACCEPTED on Mac.

          ## Шесть критериев
          1. PASS на CI — 435 тестов; локальная команда повторяет полный набор.
          2. PASS — реальные SearchByINNs/GetFullInfoByINN и точный ИНН.
          3. PASS на CI и ранее LIVE+CACHE для Сбербанка на Mac; оба локальных случая проверяются новой командой.
          4. PASS на тестах — ошибки/непроверенность не становятся not_found; N/A для отдельной бизнес-неприменимости при корректном ИНН ЮЛ/ИП. Это не движок определения необходимости лицензии.
          5. PASS на реальном Chromium CI; Mac NOT CONFIRMED до локального отчёта.
          6. PASS на CI для on-demand кэша; Mac NOT CONFIRMED до измерения текущего кэша и точного пересечения с Master.
          Полный размер реестра ЦБ и bulk import — N/A, а не искусственно пройденный массовый импорт. Дата проверки не является датой всего реестра.
          auto_update=NOT_CONFIGURED. Отдельное расписание не добавляется этой задачей.
          ''')
          Path('docs/W1_003_ACCEPTANCE.md').write_text('''# W1-003 — финальная локальная приёмка

