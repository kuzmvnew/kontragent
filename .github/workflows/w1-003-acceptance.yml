name: W1-003 PostgreSQL and browser acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**fns_sme_support*"
      - "app/aggregators/company_product_aggregator.py"
      - "app/models/__init__.py"
      - "scripts/*fns_sme_support*"
      - "tests/*fns_sme_support*"
      - "tests/acceptance/run_w1_003.py"
      - "templates/partials/msp.html"
      - "templates/partials/fns_sme_support.html"
      - "migrations/versions/f7b2d8a4c1e3_add_fns_sme_support_entries.py"
      - ".github/workflows/w1-003-acceptance.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      DADATA_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - run: uv sync --group dev
      - name: Existing migration chain on disposable PostgreSQL
        run: uv run alembic upgrade head
      - name: Complete offline test suite
        run: uv run python -m pytest tests -q
      - name: Install real Chromium
        run: uv run --with playwright==1.63.0 python -m playwright install --with-deps chromium
      - name: Synthetic PostgreSQL/browser proof and official metadata/XSD probe
        run: uv run --with playwright==1.63.0 python -c "import runpy; runpy.run_path('tests/acceptance/run_w1_003.py', run_name='__main__')"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-003-acceptance-evidence
          path: |
            data/acceptance/w1-003-ci/*.json
            data/acceptance/w1-003-ci/*.png
          if-no-files-found: ignore
          retention-days: 7
