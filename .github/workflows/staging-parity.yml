name: Staging parity foundation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  postgres-18-6-foundation:
    name: PostgreSQL 18.6 staging contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: staging
          POSTGRES_PASSWORD: staging
          POSTGRES_DB: staging_operational_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U staging -d staging_operational_fresh"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql+psycopg://staging:staging@127.0.0.1:5432/staging_operational_fresh
      PUBLIC_IMPORT_DATABASE_URL: postgresql+psycopg://staging:staging@127.0.0.1:5432/staging_public_fresh
      DADATA_API_KEY: staging-disabled
      STAGING_PARITY_POSTGRES: "1"

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Resolve exact lock
        run: uv sync --frozen --group dev

      - name: Create isolated lane databases
        env:
          PGPASSWORD: staging
        run: |
          createdb -h 127.0.0.1 -U staging staging_public_fresh
          createdb -h 127.0.0.1 -U staging staging_operational_upgrade
          createdb -h 127.0.0.1 -U staging staging_public_upgrade

      - name: Fresh operational and public migrations
        run: |
          uv run --frozen alembic -c alembic.ini upgrade head
          uv run --frozen alembic -c public_alembic.ini upgrade head
          uv run --frozen python scripts/check_schema_completeness.py

      - name: Previous-schema upgrade probes
        run: |
          DATABASE_URL=postgresql+psycopg://staging:staging@127.0.0.1:5432/staging_operational_upgrade uv run --frozen alembic -c alembic.ini upgrade head
          DATABASE_URL=postgresql+psycopg://staging:staging@127.0.0.1:5432/staging_operational_upgrade uv run --frozen alembic -c alembic.ini downgrade -1
          DATABASE_URL=postgresql+psycopg://staging:staging@127.0.0.1:5432/staging_operational_upgrade uv run --frozen alembic -c alembic.ini upgrade head
          PUBLIC_IMPORT_DATABASE_URL=postgresql+psycopg://staging:staging@127.0.0.1:5432/staging_public_upgrade uv run --frozen alembic -c public_alembic.ini upgrade head
          PUBLIC_IMPORT_DATABASE_URL=postgresql+psycopg://staging:staging@127.0.0.1:5432/staging_public_upgrade uv run --frozen alembic -c public_alembic.ini downgrade -1
          PUBLIC_IMPORT_DATABASE_URL=postgresql+psycopg://staging:staging@127.0.0.1:5432/staging_public_upgrade uv run --frozen alembic -c public_alembic.ini upgrade head

      - name: Focused staging parity tests
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          uv run --frozen python -m pytest -q
          tests/test_staging_parity.py
          tests/test_staging_parity_postgres.py
          tests/test_public_web.py
          tests/test_public_sync_ssh_wrapper.py

      - name: Byte-identical artifact double build
        env:
          STAGING_ARTIFACT_DOUBLE_BUILD: "1"
        run: >-
          uv run --frozen python -m pytest -q
          tests/test_release_artifact_reproducibility.py
