name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      DADATA_API_KEY: test-api-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Verify migrations
        run: uv run alembic upgrade head

      - name: Schema completeness
        run: uv run python scripts/check_schema_completeness.py

      - name: Check diff whitespace
        run: git diff --check

      - name: Lint critical Python errors
        run: uvx --from ruff==0.13.1 ruff check --select E9,F63,F7,F82 .

      - name: Static import and bytecode sanity
        run: uv run python -m compileall -q app main.py scripts

      - name: Scan tracked files for secrets
        run: uv run python scripts/scan_secrets.py

      - name: Audit Python dependencies
        run: uv run --with pip-audit==2.9.0 pip-audit

      - name: Run test suite
        run: uv run python -m pytest -q

      - name: Application startup smoke
        run: uv run python -c "from fastapi.testclient import TestClient; from main import app; response=TestClient(app).get('/api/health'); assert response.status_code == 200; assert response.json()['status'] == 'ok'"
