name: W1-001 PostgreSQL and browser acceptance

on:
  push:
    branches: ["acceptance/w1-001-20260916"]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/*cbr_warning*"
      - "tests/*cbr_warning*"
      - "tests/acceptance/**"
      - "templates/**"
      - ".github/workflows/w1-001-acceptance.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      DADATA_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install uv
      - run: uv sync --group dev
      - name: Existing migration chain on disposable PostgreSQL
        run: uv run alembic upgrade head
      - name: Complete offline test suite
        run: uv run python -m pytest tests -q
      - name: Install real Chromium
        run: uv run --with playwright==1.63.0 python -m playwright install --with-deps chromium
      - name: PostgreSQL rollback, real FastAPI pages and one official bulk import
        run: uv run --with playwright==1.63.0 python -c "import runpy; runpy.run_path('tests/acceptance/run_w1_001.py', run_name='__main__')"
      - name: Preserve evidence, not the complete source dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-001-acceptance-evidence
          path: |
            data/acceptance/w1-001-ci/*.json
            data/acceptance/w1-001-ci/*.png
          if-no-files-found: ignore
          retention-days: 7
