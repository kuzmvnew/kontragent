name: Prepare reviewed W1-001 changes
on:
  push:
    branches: ["acceptance/w1-001-20260916"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checksum-verified changes and create an unreferenced commit for connector review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          base = 'f18334e6ffead8afd6719e4c598e1c37e53278f2'
          workflow = '.github/workflows/w1-001-acceptance.yml'
          parts = [Path(f'.github/w1-patch-{i}.b64') for i in range(1,5)]
          allowed = {workflow, *(str(p) for p in parts)}
          changed = subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert set(changed) <= allowed, 'Unexpected concurrent changes; stop'
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fde2af8c07b05f68600221af77b69801a0f9f4a2356a665513c01c907629b6a1'
          Path(workflow).write_bytes(subprocess.check_output(['git','show',base+':'+workflow]))
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          for p in parts: p.unlink()
          subprocess.run(['git','add','-A'],check=True)
          def post(path, data):
              request=urllib.request.Request('https://api.github.com/repos/kuzmvnew/kontragent/git/'+path, data=json.dumps(data).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          elements=[]
          for name in subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0'):
              if not name: continue
              file=Path(name)
              entry={'path':name,'mode':'100644','type':'blob'}
              entry['sha']=post('blobs',{'content':file.read_text(),'encoding':'utf-8'})['sha'] if file.exists() else None
              elements.append(entry)
          tree=post('trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':elements})
          commit=post('commits',{'message':'Harden W1-001 and add PostgreSQL/browser acceptance; align Wave 1 status','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          print('REVIEWED_COMMIT_SHA='+commit['sha'])
          Path('prepared-commit.json').write_text(json.dumps({'commit_sha':commit['sha'],'tree_sha':tree['sha'],'patch_sha256':hashlib.sha256(patch).hexdigest()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w1-prepared-commit
          path: prepared-commit.json
          retention-days: 1
