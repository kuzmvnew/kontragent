version: 1
language: ru
entity: company

principles:
  - "Агрегировать спрос на уровень ИНН, а не строкового названия"
  - "Не считать общий брендовый спрос сильным сигналом для consumer/enterprise компаний"
  - "Повышать вес запросов, явно связанных с проверкой, надежностью, рисками и реквизитами"
  - "Учитывать перестановку слов, словоформы, полные/краткие названия, бренды, старые названия, латиницу и частые опечатки"

clusters:
  identity:
    weight_class: very_high
    templates:
      - "{legal_name}"
      - "{short_name}"
      - "{alias}"
      - "{legal_name} инн"
      - "инн {legal_name}"
      - "{alias} инн"
      - "инн {alias}"
      - "инн {inn}"
      - "{inn}"
      - "{legal_name} огрн"
      - "огрн {legal_name}"
      - "{legal_name} кпп"
      - "кпп {legal_name}"

  verification:
    weight_class: very_high
    templates:
      - "проверить {legal_name}"
      - "проверить компанию {legal_name}"
      - "проверка {legal_name}"
      - "проверка компании {legal_name}"
      - "проверка организации {legal_name}"
      - "проверить контрагента {legal_name}"
      - "проверка контрагента {legal_name}"
      - "проверить юридическое лицо {legal_name}"
      - "проверить фирму {legal_name}"
      - "проверить {inn}"
      - "проверка инн {inn}"

  reliability:
    weight_class: very_high
    templates:
      - "{legal_name} надежность"
      - "надежность {legal_name}"
      - "надежная ли компания {legal_name}"
      - "надежная ли {legal_name}"
      - "рейтинг надежности {legal_name}"
      - "оценка надежности {legal_name}"
      - "можно ли доверять {legal_name}"
      - "стоит ли доверять {legal_name}"
      - "благонадежность {legal_name}"

  risks:
    weight_class: very_high
    templates:
      - "{legal_name} риски"
      - "риски {legal_name}"
      - "риски компании {legal_name}"
      - "проверка рисков {legal_name}"
      - "признаки риска {legal_name}"
      - "{legal_name} проблемная компания"
      - "проблемы у компании {legal_name}"
      - "красные флаги {legal_name}"

  reputation:
    weight_class: high
    templates:
      - "{legal_name} отзывы"
      - "отзывы {legal_name}"
      - "ооо {alias} отзывы"
      - "{legal_name} отзывы клиентов"
      - "{legal_name} отзывы сотрудников"
      - "{legal_name} репутация"
      - "репутация {legal_name}"
      - "{legal_name} мошенники"
      - "{legal_name} мошенничество"
      - "{legal_name} обман"
      - "{legal_name} жалобы"
      - "жалобы на {legal_name}"

  requisites:
    weight_class: very_high
