navigation_noise:
  generic_brand_query_weight: 0.10
  consumer_brand_query_weight: 0.02
  top1000_revenue_brand_query_weight: 0.02
  high_intent_override: true

expansion_rules:
  include_legal_forms:
    - "ООО"
    - "АО"
    - "ПАО"
    - "НАО"
  include_word_order_variants: true
  include_morphology: true
  include_brand_aliases: true
  include_former_names: true
  include_latin_variants: true
  include_common_misspellings: true
  include_inn: true
  include_ogrn: true
  include_region_disambiguation: true

notes:
  - "Не отправлять все сгенерированные шаблоны в Wordstat без предварительной дедупликации и батчинга."
  - "Хранить исходный запрос, нормализованный запрос, источник, регион, дату измерения и тип частотности."
  - "Весовые классы — стартовая гипотеза. Коэффициенты калибруются на пилоте 500–1000 компаний."
