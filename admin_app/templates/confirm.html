{% extends "base.html" %}{% block title %}Подтверждение{% endblock %}{% block content %}<section class="confirm panel"><h1>{{ action_label }}?</h1><p><strong>{{ source.source_name }}</strong><br><span class="mono">{{ source.source_id }}</span></p><p>Действие будет выполнено только через канонический scheduler / Worker Foundation и записано в аудит.</p><form method="post" action="/admin/sources/{{ source.source_id }}/actions/{{ action }}"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button class="button {{ 'danger' if action in ['pause','retry'] else 'primary' }}" type="submit">Подтвердить</button><a class="button" href="/admin/sources/{{ source.source_id }}">Отмена</a></form></section>{% endblock %}
