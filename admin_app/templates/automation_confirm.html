{% extends "base.html" %}{% block title %}Политика {{ policy.source_id }} — NEXT Company{% endblock %}{% block content %}<section class="panel confirm"><h1>Политика {{ policy.source_id }}</h1><p class="muted">Разрешены только предопределённые безопасные значения.</p><form class="policy-form" method="post" action="/admin/automation/{{ policy.source_id }}/update"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label><input type="checkbox" name="auto_heal" {% if policy.auto_heal_enabled and not policy.paused %}checked{% endif %}> Автоматическое восстановление</label><label><input type="checkbox" name="auto_code_repair" {% if policy.auto_code_repair_enabled %}checked{% endif %} {% if not agent.available %}disabled{% endif %}> Автоматическое исправление кода{% if not agent.available %} — недоступно{% endif %}</label><label>Лимит попыток<select name="max_attempts">{% for value in max_attempt_values %}<option value="{{ value }}" {% if value == policy.max_attempts %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label>Интервал между попытками<select name="cooldown_seconds">{% for value in cooldown_values %}<option value="{{ value }}" {% if value == policy.cooldown_seconds %}selected{% endif %}>{{ value }} сек.</option>{% endfor %}</select></label><div><button class="button primary" type="submit">Сохранить</button><a class="button" href="/admin/automation">Отмена</a></div></form></section>{% endblock %}
