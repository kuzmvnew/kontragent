{% extends "base.html" %}
{% block title %}{{ workspace.name }} — NEXT Company{% endblock %}
{% block content %}
<section>
  <p class="eyebrow">Workspace</p>
  <h1>{{ workspace.name }}</h1>
  <p>{{ principal.email }}</p>
  <div class="metric"><span>Сохранено компаний</span><strong>{{ saved_count }}</strong></div>
  <div class="actions">
    <a class="button" href="/app/search">Найти компанию</a>
    <a class="button secondary" href="/app/saved">Сохранённые</a>
  </div>
</section>
{% endblock %}
